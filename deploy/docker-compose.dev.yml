# ============================================================================
# 本地开发依赖：MySQL 8 + Redis 7
#
# 【端口为什么不是 3306 / 6379】这台机器上宿主机的 3306 与 6379 已被其他项目的容器占用，
# 故本项目一律用 13306 / 16380，避免与它们互相踢。
#
# 用法：
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml down          # 停止，保留数据
#   docker compose -f deploy/docker-compose.dev.yml down -v       # 连数据卷一起删
#
# 【库名钉死 edumatrix】Flyway 初始基线自带 CREATE DATABASE / USE edumatrix，
# 库名不一致会让表与 flyway_schema_history 分家且不报错。这里预先建好同名库。
# ============================================================================
name: edumatrix-dev

services:
  mysql:
    image: mysql:8.0
    container_name: edumatrix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: edumatrix_root
      MYSQL_DATABASE: edumatrix
      MYSQL_USER: edumatrix
      MYSQL_PASSWORD: edumatrix
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 契约 §6.1：服务器、数据库、接口三层统一东八区
      - --default-time-zone=+08:00
      # 契约 §7.1：慢查询阈值 200ms，FIND_IN_SET 进入慢查询日志即视为缺陷
      - --slow-query-log=ON
      - --long-query-time=0.2
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --log-queries-not-using-indexes=OFF
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pedumatrix_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: edumatrix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
