# ============================================================================
# EduMatrix 后端公共配置
#
# 【配置分两类，混了就违反 05-工程结构.md §F4 / 04-实施计划.md §E F-5】
#   第一类 部署级参数 —— 环境变量，不入库，不按机构分配。本文件里一律写占位符 ${...}，
#          仓库中不得出现任何真实值。本地开发用 backend/.env（已 gitignore），
#          字段清单模板见 deploy/.env.example。
#   第二类 租户配置键 —— 在 sys_tenant_config 表里，穷举只有两个
#          （complete_rate_threshold / watermark_phone_mask，契约 §5 白名单）。
#          这两个键任何时候都不得出现在本文件里。
#   分辨方法：问「不同机构会不会要不同的值」——会，是租户配置键；不会，是部署级参数。
# ============================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: edumatrix-backend

  # --------------------------------------------------------------------------
  # 数据源
  #
  # 【MYSQL_URL 必须指向 edumatrix，且与 flyway.schemas 不得分叉】
  #   Flyway 初始基线 V202608120000__baseline.sql 内含 CREATE DATABASE IF NOT EXISTS
  #   `edumatrix` 与 USE `edumatrix`（基线内容一字未改，契约 §7.3 + 05-工程结构.md §B）。
  #
  #   实测（数据源指向 edumatrix_wrong、flyway.schemas=edumatrix）：业务表与
  #   flyway_schema_history 【都】落在 edumatrix，两者不分家；migrate() 成功完成、
  #   无任何报错；而 edumatrix_wrong 是空库。真正的后果是应用连接池此后连的是
  #   URL 指定的那个空库 —— 迁移报成功、应用启动成功、业务查询全打在空库上。
  #
  # 【不要加 allowMultiQueries=true】Flyway 自己逐条执行迁移脚本，不需要它
  #   （空库实测：41 表 / 7 分区 / 3 脚本全 success）。它是整个连接池全程生效的开关，
  #   会把任何一处 SQL 拼接注入点从"读一行"放大成"追加 ; DROP TABLE ..."。
  # --------------------------------------------------------------------------
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      # 会话时区与接口、数据库三层一致（00-通用约定 §6：统一东八区，不支持跨时区租户）
      connection-init-sql: SET time_zone = '+08:00'

  # --------------------------------------------------------------------------
  # Flyway：上线后 DDL 不再手工执行（契约 §7.3）
  #   validate-on-migrate 保持默认 true —— 已发布脚本的文件内容一旦变化，校验和
  #   不匹配会让已部署环境直接启动失败。这正是 05-工程结构.md §B2 第 18~20 项
  #   （两个已发布脚本的头注释）「倾向不改」的硬理由。
  # --------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: edumatrix
    baseline-on-migrate: false
    validate-on-migrate: true
    encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # --------------------------------------------------------------------------
  # 时间与时区（00-通用约定 §6 / 契约 §6.1）
  #   日期时间 yyyy-MM-dd HH:mm:ss，纯日期 yyyy-MM-dd，时长一律整数秒。
  #   接口不接受也不返回时间戳与 ISO8601 带时区格式。
  #   实际的序列化装配在 common/config/JacksonConfig，本处只兜底。
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # 文件上传（模块 05 / 03-01 §7.1）
  #
  # 【必须显式配，否则 10011 这条错误码在大文件上永远不会出现】
  #   Spring Boot 的默认值是单文件 1MB、单请求 10MB。不改的话，一个 20MB 的 xlsx
  #   在【进入 Controller 之前】就被 Tomcat 的 multipart 解析器拒掉，
  #   抛 MaxUploadSizeExceededException → 500，而 03-01 §7.1 要求的是
  #   10011「文件类型不支持或大小超出限制」。用户看到的是"系统繁忙"而不是"文件太大"。
  #
  # 【取 101MB 而不是 100MB】容器层的闸【故意】比业务闸松 1MB：
  #   业务上限 100MB（03-01 §7.1 逐字）由 FileUploadValidator 判并返回 10011。
  #   容器闸只作兜底防内存耗尽，两者相等会让 100MB 整的文件由容器先拒、拿不到业务码。
  # --------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 101MB
      max-request-size: 101MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

# ============================================================================
# MyBatis-Plus
#   租户过滤、逻辑删除、分页上限均在 common/config/MybatisPlusConfig 里装配，
#   本处只放不涉及安全语义的部分。
# ============================================================================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.edumatrix.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键由 common/id/IdWorker 生成（MybatisPlusConfig 里注册 IdentifierGenerator 委派过去）
      id-type: assign_id
      # ！！逻辑删除【不在此处做全局配置】！！
      # 契约 §2.2 要求的是 @TableLogic(value="0", delval="UNIX_TIMESTAMP(NOW(3))*1000")
      # —— 删除值是一个 SQL 表达式（当前毫秒时间戳），不是常量，全局配置的
      # logic-delete-value 表达不了它。写在 common/entity/BaseEntity 的 deletedAt 字段上，
      # 全库实体继承，杜绝逐表各写一份。
      # 用时间戳而非 0/1 的理由：0/1 方案下同一业务键最多只能容纳一条已删除行，
      # 「打标→去标→再打标→再去标」到第二次去标就撞唯一键，而这在
      # org_student_tag / sys_user_role / hw_answer_detail 上都是常规操作。

# ============================================================================
# 雪花 ID（common/id/IdWorker）
#   05-工程结构.md §F4 部署级参数：本项为模块 01 新增登记。
#   多实例部署时 workerId 必须逐台不同，否则会产生重复 ID。
# ============================================================================
edumatrix:
  id:
    worker-id: ${SNOWFLAKE_WORKER_ID:0}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
  idempotent:
    # 「首次请求仍在执行中」时等待它写出结果的窗口（毫秒）。
    # 00-通用约定 §7.2 只定了 Redis key 与 5 分钟 TTL，没有定义这个值 —— 故可配。
    # 超时返回 HTTP 429 + Retry-After: 1，理由见 common/idempotent/IdempotentAspect 类注释。
    wait-millis: ${IDEMPOTENT_WAIT_MILLIS:1000}

  # ==========================================================================
  # 文件存储（模块 05）
  #
  # 【bucket 非空 → OSS；为空 → 本地磁盘】两个实现的装配条件写在同一个属性上，
  #   互为反面（common/file/LocalObjectStorage 与 integration/aliyun/OssClient）。
  #   dev/test 留空走本地盘 —— 集成测试连的是 docker-compose 的 MySQL 与 Redis，没有 OSS。
  #
  # 【两个 endpoint 不是冗余】内网 endpoint 供服务端 Put/Get/Delete（同地域不计流量费、
  #   不出公网）；公网 endpoint 只用来【签名】、不发请求，因为签出来的地址是给浏览器用的。
  #   签错了会响亮失败（客户端 DNS 解析不到内网域名），不是静默故障。
  #
  # 【这里没有"签名有效期"这一项】30 分钟是安全基线不是调优参数
  #   （00-通用约定 §7.4 / 03-01 §7.3 / 03-05 §4.8 三处同一个数字），
  #   写死在 common/file/FileConstants.SIGNED_URL_TTL。做成可配等于允许把它调成 24 小时
  #   而没有任何东西会报错。
  # ==========================================================================
  file:
    # 本地存储根目录，仅 bucket 为空时使用
    local-root: ${FILE_LOCAL_ROOT:${java.io.tmpdir}/edumatrix-files}
    oss:
      bucket: ${ALIYUN_OSS_BUCKET:}
      internal-endpoint: ${ALIYUN_OSS_INTERNAL_ENDPOINT:}
      public-endpoint: ${ALIYUN_OSS_PUBLIC_ENDPOINT:}
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}

  # ==========================================================================
  # 点播与转码事件（模块 09 / 12）
  #
  # 【留空 = 整块功能不装配】两组开关，各自互为反面（与 OSS 那组同型）：
  #   region + template-group-id 非空 → integration/aliyun/VodClient
  #                             为空 → common/media/DisabledVodMediaClient
  #   smq.endpoint + smq.queue-name 非空 → integration/aliyun/SmqClient
  #                                 为空 → common/media/DisabledVodEventSource
  #
  # 【为什么不是「配错就启动失败」】OssClient 那两条自检（桶必须私有、区域必须中国大陆）
  #   是【合规基线】，配错的后果是数据当场对全互联网敞开，所以它拒绝启动。
  #   本组不同：缺配置的后果是【功能不可用】，模块 01~08 与本模块的读接口都不依赖它。
  #   而生产机 /etc/edumatrix/db.env 里【目前一个 VOD/SMQ 的键都没有】——
  #   启动失败等于「一部署新版本这台在跑的机器就起不来」，把功能缺失升级成全站停机。
  #   代价是「静默不工作」，处置见两个 Disabled 实现的构造函数：
  #   各打一条【写明后果】的 WARN，且未配置时不注册 lag 指标（避免持续假警报）。
  #
  # 【SMQ endpoint 必须是公网 Endpoint】否则点播服务写队列失败、重试 3 次后【静默丢弃】
  #   （契约 §1 上线前置确认第 1 条）。这条配错的唯一痕迹是
  #   vod_event_last_consume_lag_seconds 一路上涨——队列侧永远空着，积压指标恒为 0。
  #
  # 【模板组必须是单一清晰度 + Encrypt=true】契约 §1 部署约定第 1/2 条。
  #   配了多档会让学生实际看到的清晰度不可控——挑流挑出多路时本模块置 status=3 并告警（F-54）。
  # ==========================================================================
  vod:
    region: ${ALIYUN_VOD_REGION:}
    template-group-id: ${ALIYUN_VOD_TEMPLATE_GROUP_ID:}
    smq:
      endpoint: ${ALIYUN_SMQ_ENDPOINT:}
      queue-name: ${ALIYUN_SMQ_QUEUE_NAME:}

# ============================================================================
# XXL-Job（05-工程结构.md §H：全部任务与 Worker 集中在 com.edumatrix.job）
#   模块 01 只交付 traceId 的继承包装，第一个 Job 在模块 05/09。
#   executor.enabled 默认关闭 —— 没有调度中心时不应让应用启动失败。
# ============================================================================
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: edumatrix-backend
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logretentiondays: 30

# ============================================================================
# Sa-Token（00-通用约定 §2.1 / §2.2）
#   accessToken 2 小时、refreshToken 7 天。refreshToken 的旋转与登录链路归模块 02，
#   本处只定 Token 的基础形态。
# ============================================================================
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# ============================================================================
# 可观测性（契约 §7.1）
#   十项指标名登记在 common/metrics/MetricsRegistry，埋点一律引用常量。
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: edumatrix-backend

logging:
  level:
    root: INFO
    com.edumatrix: INFO
