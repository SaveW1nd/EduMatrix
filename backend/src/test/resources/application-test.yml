# ============================================================================
# 集成测试配置
#
# 依赖 deploy/docker-compose.dev.yml 起的两个容器：
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# 端口用 13306 / 16380 而不是 3306 / 6379 —— 宿主机的默认端口已被其他项目占用。
#
# 【库名必须是 edumatrix】Flyway 基线自带 CREATE DATABASE / USE edumatrix。
# ============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/edumatrix?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: edumatrix_root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+08:00'

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: edumatrix
    validate-on-migrate: true

  data:
    redis:
      host: 127.0.0.1
      port: 16380
      database: 1

edumatrix:
  id:
    worker-id: 1
    datacenter-id: 1

xxl:
  job:
    enabled: false

logging:
  level:
    com.edumatrix: DEBUG
